; m5web — ATOM Printer image/text print server
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Keep dependencies minimal: everything we use (WiFi, WebServer, DNSServer,
; ESPmDNS, Preferences, LittleFS) ships with the ESP32 Arduino core already.
lib_deps =

build_flags =
    -DCORE_DEBUG_LEVEL=1
