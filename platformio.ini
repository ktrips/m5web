; m5web — ATOM Printer image/text print server
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; The m5stack-atom board manifest defaults to 1500000 for uploads, which is
; unreliable on some CP210x/cable/OS combinations — esptool crashes with
; "IndexError: index out of range" mid-flash_id when a response comes back
; truncated at that speed. 460800 (the standard fallback) still hit a
; termios "Invalid argument" on macOS with this cable/adapter, so dropped
; further to the universally-supported 115200.
upload_speed = 115200
board_build.filesystem = littlefs

; Dependencies are kept minimal: WiFi, WebServer, DNSServer, ESPmDNS,
; Preferences, LittleFS, HTTPClient (plain HTTP only — WiFiClient, never
; WiFiClientSecure/TLS, per jpeg_print.cpp's fetchAndPrint()) all ship
; with the ESP32 Arduino core already. Two external libraries beyond
; that: TJpg_Decoder (jpeg_print.cpp — decodes an externally-submitted
; JPEG for /api/print/photo) and JPEGENC (jpeg_capture.cpp — encodes the
; current camera frame as JPEG for GET /capture). Both are flagged as
; untested-on-real-hardware risks on this board's limited RAM — see
; jpeg_print.h / jpeg_capture.h.
lib_deps =
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/JPEGENC@^1.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
