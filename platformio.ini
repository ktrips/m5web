; m5web — ATOM Printer image/text print server
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; The m5stack-atom board manifest defaults to 1500000 for uploads, which is
; unreliable on some CP210x/cable/OS combinations — esptool crashes with
; "IndexError: index out of range" mid-flash_id when a response comes back
; truncated at that speed. 460800 is the standard, more reliable fallback.
upload_speed = 460800
board_build.filesystem = littlefs

; Keep dependencies minimal: everything we use (WiFi, WebServer, DNSServer,
; ESPmDNS, Preferences, LittleFS, WiFiClientSecure, HTTPClient — the last
; two for openai.cpp's HTTPS calls) ships with the ESP32 Arduino core already.
lib_deps =

build_flags =
    -DCORE_DEBUG_LEVEL=1
