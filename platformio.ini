; m5web — ATOM Printer image/text print server
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; The m5stack-atom board manifest defaults to 1500000 for uploads, which is
; unreliable on some CP210x/cable/OS combinations — esptool crashes with
; "IndexError: index out of range" mid-flash_id when a response comes back
; truncated at that speed. 460800 is the standard, more reliable fallback.
upload_speed = 460800
board_build.filesystem = littlefs

; Dependencies are kept minimal: WiFi, WebServer, DNSServer, ESPmDNS,
; Preferences, LittleFS, HTTPClient (plain HTTP only — WiFiClient, never
; WiFiClientSecure/TLS, per jpeg_print.cpp's fetchAndPrint()) all ship
; with the ESP32 Arduino core already. TJpg_Decoder is the one external
; library, needed only by jpeg_print.cpp (the /api/print/photo endpoint
; that decodes an externally-submitted JPEG on-device) — see
; jpeg_print.h for why this is flagged as an untested-on-real-hardware
; risk on this board's limited RAM.
lib_deps =
    bodmer/TJpg_Decoder@^1.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
